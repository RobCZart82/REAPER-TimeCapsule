name: Desktop beta builds
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test sources
        run: python -m unittest discover -s tests -v
      - name: Install pinned packager
        run: python -m pip install pyinstaller==6.16.0 pyinstaller-hooks-contrib==2025.9
      - name: Collect runtime license notices
        run: python scripts/runtime_licenses.py
      - name: Build and test bundled application
        run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-beta-${{ matrix.os }}
          path: release-artifacts/
          if-no-files-found: error
