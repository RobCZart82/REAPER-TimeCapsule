[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reaper-timecapsule"
version = "0.3.0.dev0"
description = "Offline smart backup and non-destructive recovery for REAPER resources"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["reaper", "backup", "restore", "ReaPack", "SWS"]

[tool.setuptools.packages.find]
include = ["reaper_timecapsule*"]
